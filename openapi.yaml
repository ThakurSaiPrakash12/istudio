openapi: 3.0.3
info:
  title: Lumen Studio API
  version: 1.0.0
  description: REST API for Lumen Studio photography studio management.
servers:
  - url: https://istudio-1-txuo.onrender.com/api
    description: Render production API
  - url: http://localhost:5000/api
    description: Local API

tags:
  - name: Health
  - name: Authentication
  - name: Clients
  - name: Events
  - name: Payments
  - name: Expenses
  - name: Deliverables
  - name: Invoices

paths:
  /:
    get:
      tags: [Health]
      summary: API root
      security: []
      responses:
        '200':
          description: API service information.
          content:
            application/json:
              schema:
                type: object
                required: [success, service, message, routes]
                properties:
                  success: { type: boolean }
                  service: { type: string, example: lumen-studio-api }
                  message: { type: string }
                  routes: { type: object, additionalProperties: { type: string } }
  
  /health:
    get:
      tags: [Health]
      summary: Application health
      security: []
      responses:
        '200':
          description: Application is responding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is live.
          content:
            application/json:
              schema:
                type: object
                required: [success, status]
                properties:
                  success: { type: boolean, example: true }
                  status: { type: string, example: live }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
        '503':
          description: One or more dependencies are unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }

  /auth/signup:
    post:
      tags: [Authentication]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Account created and authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Phone number or username already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the current authenticated profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/profile:
    patch:
      tags: [Authentication]
      summary: Update the authenticated profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Profile not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Phone number already belongs to another user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/logo:
    post:
      tags: [Authentication]
      summary: Upload a profile logo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: JPG, JPEG, PNG, GIF, or WebP image; maximum 10 MB.
      responses:
        '200':
          description: Logo uploaded and profile updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoUploadResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Profile not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/profile-image:
    post:
      tags: [Authentication]
      summary: Upload a profile image alias
      description: Alias of the profile logo upload route. The multipart field is still named logo.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, format: binary }
      responses:
        '200':
          description: Image uploaded and profile updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoUploadResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /clients:
    get:
      tags: [Clients]
      summary: List the authenticated user's clients
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Client list.
          content:
            application/json:
              schema:
                type: object
                required: [success, clients]
                properties:
                  success: { type: boolean }
                  clients:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Clients]
      summary: Create a client
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientCreateRequest' }
      responses:
        '201':
          description: Client created.
          content:
            application/json:
              schema:
                type: object
                required: [success, client]
                properties:
                  success: { type: boolean }
                  client: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /clients/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Clients]
      summary: Get one client
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Client.
          content:
            application/json:
              schema:
                type: object
                required: [success, client]
                properties:
                  success: { type: boolean }
                  client: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Clients]
      summary: Update a client
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientUpdateRequest' }
      responses:
        '200':
          description: Updated client.
          content:
            application/json:
              schema:
                type: object
                required: [success, client]
                properties:
                  success: { type: boolean }
                  client: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Clients]
      summary: Delete a client
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Client still has linked events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /events:
    get:
      tags: [Events]
      summary: List the authenticated user's events
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Event list with calculated financial data.
          content:
            application/json:
              schema:
                type: object
                required: [success, events]
                properties:
                  success: { type: boolean }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Events]
      summary: Create an event
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreateRequest' }
      responses:
        '201':
          description: Event created.
          content:
            application/json:
              schema:
                type: object
                required: [success, event]
                properties:
                  success: { type: boolean }
                  event: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /events/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Events]
      summary: Get one event
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Event with calculated financial data and child resources.
          content:
            application/json:
              schema:
                type: object
                required: [success, event]
                properties:
                  success: { type: boolean }
                  event: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Events]
      summary: Update an event
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventUpdateRequest' }
      responses:
        '200':
          description: Updated event.
          content:
            application/json:
              schema:
                type: object
                required: [success, event]
                properties:
                  success: { type: boolean }
                  event: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Events]
      summary: Delete an event and its owned children
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{eventId}/payments:
    parameters:
      - { $ref: '#/components/parameters/EventId' }
    get:
      tags: [Payments]
      summary: List payments for an event
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Payment list.
          content:
            application/json:
              schema:
                type: object
                required: [success, payments]
                properties:
                  success: { type: boolean }
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Payments]
      summary: Add a payment to an owned event
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreateRequest' }
      responses:
        '201':
          description: Payment created.
          content:
            application/json:
              schema:
                type: object
                required: [success, payment]
                properties:
                  success: { type: boolean }
                  payment: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /payments/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Payments]
      summary: Get one payment
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Payment.
          content:
            application/json:
              schema:
                type: object
                required: [success, payment]
                properties:
                  success: { type: boolean }
                  payment: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Payments]
      summary: Update a payment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentUpdateRequest' }
      responses:
        '200':
          description: Updated payment.
          content:
            application/json:
              schema:
                type: object
                required: [success, payment]
                properties:
                  success: { type: boolean }
                  payment: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Payments]
      summary: Delete a payment
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{id}/proof:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Payments]
      summary: Upload or replace payment proof
      description: Payment ownership is checked before the Cloudinary upload. The stored value is an HTTPS URL.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proof]
              properties:
                proof:
                  type: string
                  format: binary
                  description: JPG, JPEG, PNG, GIF, or WebP image; maximum 10 MB.
      responses:
        '200':
          description: Payment with updated proof URL.
          content:
            application/json:
              schema:
                type: object
                required: [success, payment]
                properties:
                  success: { type: boolean }
                  payment: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /events/{eventId}/expenses:
    parameters:
      - { $ref: '#/components/parameters/EventId' }
    get:
      tags: [Expenses]
      summary: List expenses for an event
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Expense list.
          content:
            application/json:
              schema:
                type: object
                required: [success, expenses]
                properties:
                  success: { type: boolean }
                  expenses:
                    type: array
                    items: { $ref: '#/components/schemas/Expense' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Expenses]
      summary: Add an expense to an owned event
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreateRequest' }
      responses:
        '201':
          description: Expense created.
          content:
            application/json:
              schema:
                type: object
                required: [success, expense]
                properties:
                  success: { type: boolean }
                  expense: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /expenses/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Expenses]
      summary: Get one expense
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Expense.
          content:
            application/json:
              schema:
                type: object
                required: [success, expense]
                properties:
                  success: { type: boolean }
                  expense: { $ref: '#/components/schemas/Expense' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Expenses]
      summary: Update an expense
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseUpdateRequest' }
      responses:
        '200':
          description: Updated expense.
          content:
            application/json:
              schema:
                type: object
                required: [success, expense]
                properties:
                  success: { type: boolean }
                  expense: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Expenses]
      summary: Delete an expense
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{eventId}/deliverables:
    parameters:
      - { $ref: '#/components/parameters/EventId' }
    get:
      tags: [Deliverables]
      summary: List deliverables for an event
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Deliverable list.
          content:
            application/json:
              schema:
                type: object
                required: [success, deliverables]
                properties:
                  success: { type: boolean }
                  deliverables:
                    type: array
                    items: { $ref: '#/components/schemas/Deliverable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Deliverables]
      summary: Add a deliverable to an owned event
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliverableCreateRequest' }
      responses:
        '201':
          description: Deliverable created.
          content:
            application/json:
              schema:
                type: object
                required: [success, deliverable]
                properties:
                  success: { type: boolean }
                  deliverable: { $ref: '#/components/schemas/Deliverable' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /deliverables/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Deliverables]
      summary: Get one deliverable
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Deliverable.
          content:
            application/json:
              schema:
                type: object
                required: [success, deliverable]
                properties:
                  success: { type: boolean }
                  deliverable: { $ref: '#/components/schemas/Deliverable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Deliverables]
      summary: Update a deliverable
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliverableUpdateRequest' }
      responses:
        '200':
          description: Updated deliverable.
          content:
            application/json:
              schema:
                type: object
                required: [success, deliverable]
                properties:
                  success: { type: boolean }
                  deliverable: { $ref: '#/components/schemas/Deliverable' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Deliverables]
      summary: Delete a deliverable
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: filter
          required: false
          schema:
            type: string
            enum: [all, paid, pending, partial, overdue]
            default: all
      responses:
        '200':
          description: Filtered invoices and overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Invoices]
      summary: Create an invoice
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceCreateRequest' }
      responses:
        '201':
          description: Invoice created.
          content:
            application/json:
              schema:
                type: object
                required: [success, invoice]
                properties:
                  success: { type: boolean }
                  invoice: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Invoice number conflict or idempotency conflict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }

  /invoices/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Invoices]
      summary: Get one invoice
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Invoice.
          content:
            application/json:
              schema:
                type: object
                required: [success, invoice]
                properties:
                  success: { type: boolean }
                  invoice: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Invoices]
      summary: Update an invoice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceUpdateRequest' }
      responses:
        '200':
          description: Updated invoice.
          content:
            application/json:
              schema:
                type: object
                required: [success, invoice]
                properties:
                  success: { type: boolean }
                  invoice: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Invoices]
      summary: Delete an invoice
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Invoice deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /invoices/{id}/paid:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Invoices]
      summary: Mark an invoice paid
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Paid invoice.
          content:
            application/json:
              schema:
                type: object
                required: [success, invoice]
                properties:
                  success: { type: boolean }
                  invoice: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /invoices/{id}/partial:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Invoices]
      summary: Record a partial invoice payment
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, exclusiveMinimum: 0, example: 250 }
      responses:
        '200':
          description: Updated invoice.
          content:
            application/json:
              schema:
                type: object
                required: [success, invoice]
                properties:
                  success: { type: boolean }
                  invoice: { $ref: '#/components/schemas/Invoice' }
        '400':
          description: Invalid amount or amount exceeds remaining balance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /invoices/{id}/due-date:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Invoices]
      summary: Extend or change an invoice due date
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dueDate]
              properties:
                dueDate: { type: string, format: date-time, example: '2035-03-01T00:00:00.000Z' }
      responses:
        '200':
          description: Updated invoice.
          content:
            application/json:
              schema:
                type: object
                required: [success, invoice]
                properties:
                  success: { type: boolean }
                  invoice: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by signup or login.
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    EventId:
      in: path
      name: eventId
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 200 }
      description: Optional user-scoped key. Reusing it with the same request replays the stored response; using it for a different request returns 409.
  responses:
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, malformed, expired, or invalid JWT.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource does not exist or is not owned by the authenticated user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    IdempotencyConflict:
      description: Idempotency key conflicts with another request or matching request is still pending.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: Server or dependency failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Success:
      description: Operation succeeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Resource not found. }
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: true }
    SuccessMessageResponse:
      allOf:
        - { $ref: '#/components/schemas/SuccessResponse' }
        - type: object
          properties:
            message: { type: string, example: Invoice deleted. }
    HealthResponse:
      type: object
      required: [success, service]
      properties:
        success: { type: boolean }
        service: { type: string, example: lumen-studio-api }
    ReadinessResponse:
      type: object
      required: [success, status, dependencies]
      properties:
        success: { type: boolean }
        status: { type: string, enum: [ready, not_ready] }
        dependencies:
          type: object
          required: [mongodb, cloudinary]
          properties:
            mongodb: { type: boolean }
            cloudinary:
              type: object
              required: [configured, reachable]
              properties:
                configured: { type: boolean }
                reachable: { type: boolean }
    User:
      type: object
      required: [id, username, phone, studioName, ownerName, email, city, address, about, instagram, youtube, website, specialties, logoUrl]
      properties:
        id: { type: string }
        username: { type: string }
        phone: { type: string, pattern: '^\d{10}$' }
        studioName: { type: string }
        ownerName: { type: string }
        email: { type: string }
        city: { type: string }
        address: { type: string }
        about: { type: string }
        instagram: { type: string }
        youtube: { type: string }
        website: { type: string }
        specialties: { type: string }
        logoUrl:
          type: string
          format: uri
          pattern: '^https://.*cloudinary.com/.*'
    UserResponse:
      type: object
      required: [success, user]
      properties:
        success: { type: boolean }
        user: { $ref: '#/components/schemas/User' }
    AuthResponse:
      type: object
      required: [success, token, user]
      properties:
        success: { type: boolean }
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    SignupRequest:
      type: object
      required: [username, phone, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 24, pattern: '^[A-Za-z0-9_]+$' }
        phone: { type: string, description: 10 digits; Indian 0/91 prefixes are normalized. }
        password: { type: string, minLength: 8, format: password }
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string }
        password: { type: string, format: password }
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        phone: { type: string }
        studioName: { type: string, maxLength: 240 }
        ownerName: { type: string, maxLength: 240 }
        email: { type: string, format: email, maxLength: 240 }
        city: { type: string, maxLength: 240 }
        address: { type: string, maxLength: 240 }
        about: { type: string, maxLength: 240 }
        instagram: { type: string, maxLength: 240 }
        youtube: { type: string, maxLength: 240 }
        website: { type: string, maxLength: 240 }
        specialties: { type: string, maxLength: 240 }
        logoUrl: { type: string, format: uri }
    LogoUploadResponse:
      type: object
      required: [success, imageUrl, user]
      properties:
        success: { type: boolean }
        imageUrl: { type: string, format: uri, pattern: '^https://.*cloudinary.com/.*' }
        user: { $ref: '#/components/schemas/User' }
    Client:
      type: object
      required: [id, name, phone, email, address, notes]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
    ClientCreateRequest:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, minLength: 3, maxLength: 20 }
        email: { type: string, format: email, maxLength: 160 }
        address: { type: string, maxLength: 300 }
        notes: { type: string, maxLength: 1000 }
    ClientUpdateRequest:
      type: object
      additionalProperties: false
      description: All fields are optional for PUT; supplied fields use the create constraints.
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, minLength: 3, maxLength: 20 }
        email: { type: string, format: email, maxLength: 160 }
        address: { type: string, maxLength: 300 }
        notes: { type: string, maxLength: 1000 }
    EventCreateRequest:
      type: object
      required: [title, eventType, startsAt, location, status, totalAmount]
      properties:
        clientId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        title: { type: string, minLength: 1, maxLength: 200 }
        eventType: { type: string, minLength: 1, maxLength: 80 }
        startsAt: { type: string, format: date-time }
        startTime: { type: string, maxLength: 30 }
        endTime: { type: string, maxLength: 30 }
        location: { type: string, minLength: 1, maxLength: 240 }
        status: { type: string, enum: [upcoming, inProgress, paymentDue, completed, cancelled] }
        totalAmount: { type: number, minimum: 0 }
        notes: { type: string, maxLength: 2000 }
    EventUpdateRequest:
      type: object
      additionalProperties: false
      description: All fields are optional for PUT.
      properties:
        clientId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        title: { type: string, minLength: 1, maxLength: 200 }
        eventType: { type: string, minLength: 1, maxLength: 80 }
        startsAt: { type: string, format: date-time }
        startTime: { type: string, maxLength: 30 }
        endTime: { type: string, maxLength: 30 }
        location: { type: string, minLength: 1, maxLength: 240 }
        status: { type: string, enum: [upcoming, inProgress, paymentDue, completed, cancelled] }
        totalAmount: { type: number, minimum: 0 }
        notes: { type: string, maxLength: 2000 }
    Event:
      type: object
      required: [id, title, eventType, startsAt, startTime, endTime, location, status, totalAmount, clientId, clientName, payments, expenses, deliverables, amountReceived, remainingAmount, totalExpenses, netProfit]
      properties:
        id: { type: string }
        clientId: { type: string, nullable: true }
        clientName: { type: string }
        title: { type: string }
        eventType: { type: string }
        startsAt: { type: string, format: date-time }
        startTime: { type: string }
        endTime: { type: string }
        location: { type: string }
        status: { type: string, enum: [upcoming, inProgress, paymentDue, completed, cancelled] }
        totalAmount: { type: number }
        notes: { type: string }
        payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        expenses: { type: array, items: { $ref: '#/components/schemas/Expense' } }
        deliverables: { type: array, items: { $ref: '#/components/schemas/Deliverable' } }
        amountReceived: { type: number }
        remainingAmount: { type: number }
        totalExpenses: { type: number }
        netProfit: { type: number }
    Payment:
      type: object
      required: [id, title, amount, paidAt, method, reference, proof]
      properties:
        id: { type: string }
        title: { type: string }
        amount: { type: number, minimum: 0.01 }
        paidAt: { type: string, format: date-time }
        method: { type: string, enum: [cash, upi, bankTransfer, card, other] }
        reference: { type: string }
        proof: { type: string, nullable: true, format: uri }
    PaymentCreateRequest:
      type: object
      required: [title, amount, paidAt, method]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        amount: { type: number, exclusiveMinimum: 0 }
        paidAt: { type: string, format: date-time }
        method: { type: string, enum: [cash, upi, bankTransfer, card, other] }
        reference: { type: string, maxLength: 160 }
        proofUrl: { type: string, format: uri, pattern: '^https://' }
    PaymentUpdateRequest:
      type: object
      additionalProperties: false
      description: All fields are optional for PUT.
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        amount: { type: number, exclusiveMinimum: 0 }
        paidAt: { type: string, format: date-time }
        method: { type: string, enum: [cash, upi, bankTransfer, card, other] }
        reference: { type: string, maxLength: 160 }
        proofUrl: { type: string, format: uri, pattern: '^https://' }
    Expense:
      type: object
      required: [id, title, amount, category, incurredAt]
      properties:
        id: { type: string }
        title: { type: string }
        amount: { type: number, minimum: 0.01 }
        category: { type: string }
        incurredAt: { type: string, format: date-time }
    ExpenseCreateRequest:
      type: object
      required: [title, amount, category, incurredAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        amount: { type: number, exclusiveMinimum: 0 }
        category: { type: string, minLength: 1, maxLength: 100 }
        incurredAt: { type: string, format: date-time }
    ExpenseUpdateRequest:
      type: object
      additionalProperties: false
      description: All fields are optional for PUT.
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        amount: { type: number, exclusiveMinimum: 0 }
        category: { type: string, minLength: 1, maxLength: 100 }
        incurredAt: { type: string, format: date-time }
    Deliverable:
      type: object
      required: [id, title, stage, isCompleted, completedAt]
      properties:
        id: { type: string }
        title: { type: string }
        stage: { type: string }
        isCompleted: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }
    DeliverableCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        stage: { type: string, maxLength: 100 }
        isCompleted: { type: boolean }
    DeliverableUpdateRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        stage: { type: string, maxLength: 100 }
        isCompleted: { type: boolean }
    InvoiceDeliverable:
      type: object
      required: [id, name, cost]
      properties:
        id: { type: string }
        name: { type: string }
        cost: { type: number, minimum: 0 }
    Invoice:
      type: object
      required: [id, number, eventName, contactName, phone, address, issuedOn, dueDate, deliverables, upiId, amountReceived, total, pendingAmount, status]
      properties:
        id: { type: string }
        number: { type: string }
        eventName: { type: string }
        contactName: { type: string }
        phone: { type: string }
        address: { type: string }
        issuedOn: { type: string, format: date-time }
        dueDate: { type: string, format: date-time }
        deliverables: { type: array, items: { $ref: '#/components/schemas/InvoiceDeliverable' } }
        upiId: { type: string }
        amountReceived: { type: number }
        total: { type: number }
        pendingAmount: { type: number }
        status: { type: string, enum: [paid, pending, partial, overdue] }
    InvoiceCreateRequest:
      type: object
      required: [eventName, contactName, phone, address, dueDate, deliverables]
      properties:
        eventName: { type: string, minLength: 1, maxLength: 160 }
        contactName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, description: 10 digits after normalization. }
        address: { type: string, minLength: 1, maxLength: 300 }
        issuedOn: { type: string, format: date-time }
        dueDate: { type: string, format: date-time }
        amountReceived: { type: number, minimum: 0 }
        upiId: { type: string, maxLength: 120 }
        deliverables:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, cost]
            properties:
              id: { type: string }
              name: { type: string, minLength: 1, maxLength: 160 }
              cost: { type: number, exclusiveMinimum: 0 }
    InvoiceUpdateRequest:
      type: object
      properties:
        eventName: { type: string, minLength: 1, maxLength: 160 }
        contactName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string }
        address: { type: string, minLength: 1, maxLength: 300 }
        issuedOn: { type: string, format: date-time }
        dueDate: { type: string, format: date-time }
        amountReceived: { type: number, minimum: 0 }
        upiId: { type: string, maxLength: 120 }
        deliverables:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, cost]
            properties:
              id: { type: string }
              name: { type: string, minLength: 1, maxLength: 160 }
              cost: { type: number, exclusiveMinimum: 0 }
    InvoiceListResponse:
      type: object
      required: [success, invoices, overview, nextNumber]
      properties:
        success: { type: boolean }
        invoices: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        overview:
          type: object
          required: [total, received, pending]
          properties:
            total: { type: number }
            received: { type: number }
            pending: { type: number }
        nextNumber: { type: string, example: INV-1001 }
